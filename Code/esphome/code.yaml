sensor:
  # - platform: homeassistant
  #   name: "Bar Light Brightness"
  #   id: led_controller_1_light_bar_brightness
  #   entity_id: light.led_controller_1_light_bar
  #   attribute: brightness
  #   unit_of_measurement: "%"
  #   filters:
  #     - lambda: |-
  #         if (isnan(x)) return 0.0f;
  #         return int(x * 100.0f / 255.0f);

  - platform: rotary_encoder
    name: "Encoder 1"
    id: encoder1
    pin_a: GPIO10
    pin_b: GPIO11
    resolution: 4
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "Encoder1 value: %.0f"
            args: ["id(encoder1).state"]

  - platform: rotary_encoder
    name: "Encoder 2"
    id: encoder2
    pin_a: GPIO15
    pin_b: GPIO16
    resolution: 4
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "Encoder2 value: %.0f"
            args: ["id(encoder2).state"]

  - platform: rotary_encoder
    name: "Encoder 3"
    id: encoder3
    pin_a: GPIO33
    pin_b: GPIO34
    resolution: 4
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "Encoder3 value: %.0f"
            args: ["id(encoder3).state"]

  - platform: rotary_encoder
    name: "Encoder 4"
    id: encoder4
    pin_a: GPIO38
    pin_b: GPIO39
    resolution: 4
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "Encoder4 value: %.0f"
            args: ["id(encoder4).state"]

